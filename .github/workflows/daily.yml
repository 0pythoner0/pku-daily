name: PKU Daily

on:
  schedule:
    # UTC 时间！北京时间 = UTC + 8
    # 22:30 UTC = 早上 6:30 北京时间
    - cron: '10 00 * * *'
  workflow_dispatch: {}   # 允许在网页上手动点一下"运行"来测试

permissions:
  contents: write          # 允许机器人把 last_run.txt 运行日志提交回仓库

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5   # v5 起用 Node 24 运行时（v4 的 Node 20 已被 GitHub 弃用）

      - name: 安装 Python
        uses: actions/setup-python@v6   # v6 起用 Node 24 运行时（v5 的 Node 20 已被 GitHub 弃用）
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行聚合脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python main.py

      - name: 保存运行日志
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git diff --cached --quiet || git commit -m "chore: update run log $(date +%F)"
          git push
